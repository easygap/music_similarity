<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
  <title>SoundMatch 동작 원리</title>
  <rect width="1200" height="400" fill="#FFFFFF"/>

  <!-- 상단 괘선 + 제목 -->
  <line x1="48" y1="64" x2="1152" y2="64" stroke="#111216" stroke-opacity=".3"/>
  <text x="48" y="44" fill="#111216" font-size="20" font-weight="600" letter-spacing="-.4">음원 하나가 "닮은 곡과 그 이유"가 되기까지</text>
  <text x="1152" y="44" text-anchor="end" fill="#111216" fill-opacity=".54" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13">backend/audio_features.py → similarity.py → reason_engine.py</text>

  <!-- 단계 상자 -->
  <g font-size="14">
    <!-- 1. 음원 -->
    <g transform="translate(48 104)">
      <rect width="196" height="196" rx="14" fill="#FFFFFF" stroke="#111216" stroke-opacity=".3"/>
      <text x="18" y="30" fill="#111216" fill-opacity=".54" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12">01</text>
      <text x="18" y="62" fill="#111216" font-size="17" font-weight="600">음원 파일</text>
      <text x="18" y="86" fill="#111216" fill-opacity=".68">mp3 · wav · flac · ogg · m4a</text>
      <text x="18" y="108" fill="#111216" fill-opacity=".68">앞부분 30초만 읽는다</text>
      <!-- 파형 -->
      <g transform="translate(18 118)" stroke="#111216" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="18" x2="0" y2="30"/><line x1="8" y1="8" x2="8" y2="40"/><line x1="16" y1="14" x2="16" y2="34"/>
        <line x1="24" y1="2" x2="24" y2="46"/><line x1="32" y1="12" x2="32" y2="36"/><line x1="40" y1="20" x2="40" y2="28"/>
        <line x1="48" y1="6" x2="48" y2="42"/><line x1="56" y1="16" x2="56" y2="32"/><line x1="64" y1="10" x2="64" y2="38"/>
        <line x1="72" y1="0" x2="72" y2="48"/><line x1="80" y1="14" x2="80" y2="34"/><line x1="88" y1="18" x2="88" y2="30"/>
        <line x1="96" y1="8" x2="96" y2="40"/><line x1="104" y1="12" x2="104" y2="36"/><line x1="112" y1="4" x2="112" y2="44"/>
        <line x1="120" y1="16" x2="120" y2="32"/><line x1="128" y1="10" x2="128" y2="38"/><line x1="136" y1="20" x2="136" y2="28"/>
        <line x1="144" y1="6" x2="144" y2="42"/><line x1="152" y1="14" x2="152" y2="34"/><line x1="160" y1="18" x2="160" y2="30"/>
      </g>
      <text x="18" y="184" fill="#111216" fill-opacity=".54" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="11">분석 뒤 즉시 삭제</text>
    </g>

    <!-- 화살표 -->
    <g stroke="#111216" stroke-opacity=".4" stroke-width="1.5" fill="none">
      <path d="M252 202h30m-8-8 8 8-8 8"/>
      <path d="M492 202h30m-8-8 8 8-8 8"/>
      <path d="M732 202h30m-8-8 8 8-8 8"/>
      <path d="M972 202h30m-8-8 8 8-8 8"/>
    </g>

    <!-- 2. 특성 추출 -->
    <g transform="translate(288 104)">
      <rect width="196" height="196" rx="14" fill="#FFFFFF" stroke="#111216" stroke-opacity=".3"/>
      <text x="18" y="30" fill="#111216" fill-opacity=".54" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12">02 · librosa</text>
      <text x="18" y="62" fill="#111216" font-size="17" font-weight="600">비교에 쓸 57개 특성</text>
      <text x="18" y="86" fill="#111216" fill-opacity=".68">템포 · 음량 · 스펙트럼 중심</text>
      <text x="18" y="106" fill="#111216" fill-opacity=".68">대역폭 · 롤오프 · 제로 크로싱</text>
      <text x="18" y="126" fill="#111216" fill-opacity=".68">화성/타악 · 크로마 · MFCC</text>
      <!-- 특성 막대 -->
      <g transform="translate(18 146)">
        <rect x="0" y="22" width="14" height="18" fill="#111216"/><rect x="20" y="8" width="14" height="32" fill="#111216"/>
        <rect x="40" y="28" width="14" height="12" fill="#111216"/><rect x="60" y="2" width="14" height="38" fill="#111216"/>
        <rect x="80" y="18" width="14" height="22" fill="#111216"/><rect x="100" y="12" width="14" height="28" fill="#111216"/>
        <rect x="120" y="30" width="14" height="10" fill="#111216"/><rect x="140" y="6" width="14" height="34" fill="#111216"/>
        <line x1="0" y1="40.5" x2="160" y2="40.5" stroke="#111216" stroke-opacity=".3"/>
      </g>
    </g>

    <!-- 3. 표준화 -->
    <g transform="translate(528 104)">
      <rect width="196" height="196" rx="14" fill="#FFFFFF" stroke="#111216" stroke-opacity=".3"/>
      <text x="18" y="30" fill="#111216" fill-opacity=".54" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12">03 · scikit-learn</text>
      <text x="18" y="62" fill="#111216" font-size="17" font-weight="600">같은 잣대로 맞춤</text>
      <text x="18" y="86" fill="#111216" fill-opacity=".68">StandardScaler 로 단위가</text>
      <text x="18" y="106" fill="#111216" fill-opacity=".68">제각각인 값을 표준화</text>
      <text x="18" y="126" fill="#111216" fill-opacity=".68">카탈로그와 같은 scaler 재사용</text>
      <g transform="translate(18 150)" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12" fill="#111216">
        <text x="0" y="12">bpm 143.6 → z 0.72</text>
        <text x="0" y="32" fill-opacity=".54">rms 0.286 → z 0.73</text>
      </g>
    </g>

    <!-- 4. 유사도 -->
    <g transform="translate(768 104)">
      <rect width="196" height="196" rx="14" fill="#FFFFFF" stroke="#111216" stroke-opacity=".3"/>
      <text x="18" y="30" fill="#111216" fill-opacity=".54" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12">04 · cosine similarity</text>
      <text x="18" y="62" fill="#111216" font-size="17" font-weight="600">781곡과 거리 재기</text>
      <text x="18" y="86" fill="#111216" fill-opacity=".68">벡터 사이 각도로 닮음을 재고</text>
      <text x="18" y="106" fill="#111216" fill-opacity=".68">가까운 순으로 상위 N곡</text>
      <!-- 미니 소리 지도 -->
      <g transform="translate(18 122)">
        <rect width="160" height="60" rx="6" fill="none" stroke="#111216" stroke-opacity=".14"/>
        <g fill="#111216" fill-opacity=".3">
          <circle cx="14" cy="18" r="2.5"/><circle cx="30" cy="40" r="2.5"/><circle cx="48" cy="12" r="2.5"/><circle cx="66" cy="48" r="2.5"/>
          <circle cx="92" cy="14" r="2.5"/><circle cx="118" cy="46" r="2.5"/><circle cx="140" cy="20" r="2.5"/><circle cx="150" cy="44" r="2.5"/>
          <circle cx="104" cy="30" r="2.5"/><circle cx="40" cy="28" r="2.5"/><circle cx="128" cy="10" r="2.5"/>
        </g>
        <g stroke="#004CFF" stroke-opacity=".8"><line x1="80" y1="30" x2="70" y2="22"/><line x1="80" y1="30" x2="94" y2="38"/><line x1="80" y1="30" x2="90" y2="20"/></g>
        <g fill="#004CFF" stroke="#FFFFFF" stroke-width="1.5"><circle cx="70" cy="22" r="4"/><circle cx="94" cy="38" r="4"/><circle cx="90" cy="20" r="4"/></g>
        <circle cx="80" cy="30" r="5" fill="#111216" stroke="#FFFFFF" stroke-width="1.5"/>
      </g>
    </g>

    <!-- 5. 이유 -->
    <g transform="translate(1008 104)">
      <rect width="144" height="196" rx="14" fill="#111216"/>
      <text x="18" y="30" fill="#FFFFFF" fill-opacity=".6" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12">05 · 결과</text>
      <text x="18" y="62" fill="#FFFFFF" font-size="17" font-weight="600">닮은 곡 + 이유</text>
      <text x="18" y="88" fill="#CCFF00" font-size="30" font-weight="500" letter-spacing="-1">94.1<tspan font-size="14" fill="#FFFFFF" fill-opacity=".7">%</tspan></text>
      <text x="18" y="114" fill="#FFFFFF" fill-opacity=".8" font-size="12.5">음색(밝기) 71% 근접</text>
      <text x="18" y="134" fill="#FFFFFF" fill-opacity=".8" font-size="12.5">MFCC 71% 근접</text>
      <text x="18" y="154" fill="#FFFFFF" fill-opacity=".8" font-size="12.5">템포·리듬 61% 근접</text>
      <text x="18" y="182" fill="#FFFFFF" fill-opacity=".5" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="11">문장으로 설명</text>
    </g>
  </g>

  <!-- 하단 주석 -->
  <line x1="48" y1="340" x2="1152" y2="340" stroke="#111216" stroke-opacity=".3"/>
  <text x="48" y="368" fill="#111216" fill-opacity=".54" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13">카탈로그 781곡 · 길이를 제외한 57개 특성으로 비교</text>
  <text x="1152" y="368" text-anchor="end" fill="#111216" fill-opacity=".54" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13">같은 파이프라인을 CLI(python -m backend.cli)에서도 쓴다</text>
</svg>
